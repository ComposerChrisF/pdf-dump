[package]
name = "pdf-dump"
version = "0.31.5"
edition = "2024"
rust-version = "1.92"
description = "CLI tool for inspecting and debugging PDF internals"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ComposerChrisF/pdf-dump"
homepage = "https://github.com/ComposerChrisF/pdf-dump"
readme = "README.md"
keywords = ["pdf", "cli", "inspect", "debug"]
categories = ["command-line-utilities"]
exclude = ["CLAUDE.md", "DEBUGGING_WITH_PDF_DUMP.md", ".github/", ".claude/", "bugs/", "plans/", "docs/"]

[lib]
name = "pdf_dump"
path = "src/lib.rs"

[[bin]]
name = "pdf-dump"
path = "src/main.rs"

[dependencies]
lopdf = "0.42.0"
png = "0.18.1"
clap = { version = "4.4", features = ["derive", "string"] }
cli-contract = "0.6"
flate2 = "1.0"
hayro-ccitt = "0.5.0"
hayro-jbig2 = { version = "0.4.0", default-features = false, features = ["std"] }
serde_json = "1.0"
weezl = "0.1"
regex = "1"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.14"
