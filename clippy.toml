# house-lints v2 (2026-11-16) — copy this file verbatim to the crate or workspace root.
# The canonical copy lives in Chris's coding hub, under house-lints/; a copy that
# differs from it is drift.  Each `reason` names the fix, so the warning tells an
# agent what to write instead.

# Tests may unwrap, expect, and panic: a failing test is meant to stop.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

# Code nested more than 6 blocks deep in one function is flagged: the function
# body is one block, and each if/else, loop, braced match arm, closure, and the
# impl around a method adds one.  Remedy: a helper function, or an early
# continue/return.  A deliberate deep block takes
# #[expect(clippy::excessive_nesting, reason = "...")].
excessive-nesting-threshold = 6

disallowed-methods = [
  { path = "std::path::Path::exists", reason = "answers false for every error, not only NotFound (EACCES, EIO, ELOOP). Use cli_contract::paths::presence_resolved, which follows a link as exists does (cli-contract 0.6.4 and later; a link to nothing, here or at a folder above, is an error, never absent). Without cli-contract: fs::metadata, reading NotFound as absent only when fs::symlink_metadata answers NotFound too, which still misses a link to nothing at a folder above; any other error is Unknown, never absent" },
  { path = "std::path::Path::is_dir", reason = "answers false for every error, not only NotFound. Use cli_contract::paths::presence_resolved (cli-contract 0.6.4 and later; a link to nothing, here or at a folder above, is an error, never absent). Without cli-contract: fs::metadata, reading NotFound as absent only when fs::symlink_metadata answers NotFound too, which still misses a link to nothing at a folder above; any other error is Unknown, never absent" },
  { path = "std::path::Path::is_file", reason = "answers false for every error, not only NotFound. Use cli_contract::paths::presence_resolved (cli-contract 0.6.4 and later; a link to nothing, here or at a folder above, is an error, never absent). Without cli-contract: fs::metadata, reading NotFound as absent only when fs::symlink_metadata answers NotFound too, which still misses a link to nothing at a folder above; any other error is Unknown, never absent" },
  { path = "std::fs::create_dir_all", reason = "creates a caller-asserted directory, or a mount point, silently. Use cli_contract::paths::ensure_destination with the caller's --create-destination mode; a tool-owned cache may keep this with #[expect(clippy::disallowed_methods, reason = \"tool-owned\")]" },
  { path = "std::process::exit", reason = "skips destructors and buffered output, and hides the exit table. Return std::process::ExitCode from main, with the codes from cli_contract::exit" },
]
